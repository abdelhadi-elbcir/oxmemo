name: Deploy oxmemo.com to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxmemo-production-deployment
  cancel-in-progress: true

env:
  APP_DIR: /var/www/oxmemo.com

jobs:
  deploy:
    name: Build and Deploy oxmemo.com
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Build React / Vite application
      # --------------------------------------------------
      - name: Build application
        run: npm run build

      # --------------------------------------------------
      # 5. Verify build
      # --------------------------------------------------
      - name: Verify build
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory does not exist."
            exit 1
          fi

          echo "Build generated successfully:"
          ls -lah dist/

      # --------------------------------------------------
      # 6. Configure SSH
      # --------------------------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # --------------------------------------------------
      # 7. Test SSH connection
      # --------------------------------------------------
      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'SSH connection successful' && whoami && hostname"

      # --------------------------------------------------
      # 8. Create application/release directory
      # --------------------------------------------------
      - name: Create release directory
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p ${{ env.APP_DIR }}/releases/${{ github.sha }}"

      # --------------------------------------------------
      # 9. Upload build
      # --------------------------------------------------
      - name: Upload application
        run: |
          rsync \
            -az \
            --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.APP_DIR }}/releases/${{ github.sha }}/

      # --------------------------------------------------
      # 10. Activate new release
      # --------------------------------------------------
      - name: Activate release
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "ln -sfn ${{ env.APP_DIR }}/releases/${{ github.sha }} ${{ env.APP_DIR }}/current"

      # --------------------------------------------------
      # 11. Verify deployed files
      # --------------------------------------------------
      - name: Verify deployment
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "test -f ${{ env.APP_DIR }}/current/index.html && echo 'index.html found - deployment OK'"

      # --------------------------------------------------
      # 12. Delete old releases
      # Keep latest 5 releases
      # --------------------------------------------------
      - name: Clean old releases
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ env.APP_DIR }}/releases && ls -dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf"

      # --------------------------------------------------
      # 13. Deployment information
      # --------------------------------------------------
      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Deployment successful"
          echo "Domain: https://oxmemo.com"
          echo "Commit: ${{ github.sha }}"
          echo "Path: ${{ env.APP_DIR }}/current"
          echo "======================================"

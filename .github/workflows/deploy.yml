name: Deploy oxmemo.com

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxmemo-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build React application
        run: npm run build

      - name: Detect build directory
        shell: bash
        run: |
          if [ -f "dist/index.html" ]; then
            echo "BUILD_DIR=dist" >> "$GITHUB_ENV"
            echo "Using Vite build directory: dist"

          elif [ -f "build/index.html" ]; then
            echo "BUILD_DIR=build" >> "$GITHUB_ENV"
            echo "Using CRA build directory: build"

          else
            echo "ERROR: Could not find dist/index.html or build/index.html"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/oxmemo_deploy_key
          chmod 600 ~/.ssh/oxmemo_deploy_key

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh \
            -i ~/.ssh/oxmemo_deploy_key \
            -o StrictHostKeyChecking=yes \
            root@"$VPS_HOST" \
            "echo 'SSH connection successful'"

      - name: Prepare deployment directory
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh \
            -i ~/.ssh/oxmemo_deploy_key \
            -o StrictHostKeyChecking=yes \
            root@"$VPS_HOST" \
            "mkdir -p /var/www/oxmemo.com"

      - name: Deploy React application
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync \
            -az \
            --delete \
            -e "ssh -i ~/.ssh/oxmemo_deploy_key -o StrictHostKeyChecking=yes" \
            "${BUILD_DIR}/" \
            root@"$VPS_HOST":/var/www/oxmemo.com/

      - name: Fix permissions and SELinux context
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh \
            -i ~/.ssh/oxmemo_deploy_key \
            -o StrictHostKeyChecking=yes \
            root@"$VPS_HOST" << 'EOF'

          set -e

          chown -R root:root /var/www/oxmemo.com

          find /var/www/oxmemo.com \
            -type d \
            -exec chmod 755 {} \;

          find /var/www/oxmemo.com \
            -type f \
            -exec chmod 644 {} \;

          restorecon -RF /var/www/oxmemo.com

          nginx -t

          systemctl reload nginx

          echo "Deployment completed successfully"

          EOF

      - name: Verify deployed site
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh \
            -i ~/.ssh/oxmemo_deploy_key \
            root@"$VPS_HOST" \
            "test -f /var/www/oxmemo.com/index.html && echo 'index.html exists'"
